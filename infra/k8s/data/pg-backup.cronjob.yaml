# Nightly logical backup of the data-ns postgres (gipc_ai — the RAG corpus + pgvector store)
# to Cloudflare R2. Off-cluster by design: survives node death, host migration, or an Oracle
# free-tier rug-pull (docs/infra/oracle-migration-runbook.md §1).
#
# Lives in the GIPC namespace: the postgres-ingress netpol admits namespace gipc (the proven
# ai-service path). Fresh pods sit outside kube-router's netpol ipsets for ~10s after start
# (VERIFIED 2026-08-08; the Sprint-H "fresh-pod ipset lag") — so the dump container first
# waits for pg_isready. Without that wait, every retry pod is fresh and fails inside its own
# lag window, forever.
#
# Required Secrets (imperative, never in git — both in ns gipc):
#   pg-backup-auth  — key `password`, copied from the data-ns `postgres` Secret
#   r2-backup       — AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / ENDPOINT
#                     (token gipc-backups-rw: Object R&W, scoped to bucket gipc-backups ONLY)
#
# Verify after first run:
#   kubectl -n gipc create job --from=cronjob/pg-backup pg-backup-manual
#   kubectl -n gipc logs job/pg-backup-manual -c upload    # expect the dump listed in R2
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: gipc
spec:
  schedule: "0 17 * * *" # 17:00 UTC = 03:00 AEST — quiet hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: pg-backup } # matches the postgres-ingress netpol allow rule
        spec:
          restartPolicy: Never
          # dump (init) → upload (main) via shared emptyDir; pg image matches the live server
          # (pgvector/pgvector:pg16) so pg_dump can never be newer than the daemon it dumps.
          initContainers:
            - name: dump
              image: pgvector/pgvector:pg16
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # ride out the fresh-pod ipset lag (~10s) + any postgres restart, up to 2 min
                  for i in $(seq 1 24); do
                    pg_isready -h postgres.data.svc.cluster.local -t 3 >/dev/null 2>&1 && break
                    echo "waiting for postgres ($i)"; sleep 5
                  done
                  pg_dump -Fc -h postgres.data.svc.cluster.local -U gipc -d gipc_ai \
                    -f "/backup/gipc_ai-$(date -u +%Y%m%d-%H%M%S).dump"
                  ls -lh /backup
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: pg-backup-auth, key: password }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          containers:
            - name: upload
              image: rclone/rclone:1.68
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  rclone copy /backup r2:gipc-backups/pg/ --s3-no-check-bucket
                  # retention: keep 30 days of nightlies
                  rclone delete r2:gipc-backups/pg/ --min-age 30d
                  rclone lsl r2:gipc-backups/pg/ | tail -5
              env:
                - { name: RCLONE_CONFIG_R2_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_R2_PROVIDER, value: Cloudflare }
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: r2-backup, key: AWS_ACCESS_KEY_ID }
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: r2-backup, key: AWS_SECRET_ACCESS_KEY }
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: r2-backup, key: ENDPOINT }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 250m, memory: 128Mi }
          volumes:
            - name: backup
              emptyDir: {}
