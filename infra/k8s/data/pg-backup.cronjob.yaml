# Nightly logical backup of the data-ns postgres (gipc_ai — the RAG corpus + pgvector store)
# to Cloudflare R2. Off-cluster by design: survives node death, host migration, or an Oracle
# free-tier rug-pull (docs/infra/oracle-migration-runbook.md §1). READY-TO-APPLY, not yet
# applied — blocked on the `r2-backup` Secret below (R2 bucket + scoped S3 token; the R2
# product opt-in + token mint are dashboard steps, same wall as terraform/cloudflare's
# backend.tf.example).
#
# Required Secret (imperative, never in git):
#   kubectl -n data create secret generic r2-backup \
#     --from-literal=AWS_ACCESS_KEY_ID=… \
#     --from-literal=AWS_SECRET_ACCESS_KEY=… \
#     --from-literal=ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
#   Token scope: Object Read & Write on bucket gipc-backups ONLY (least privilege).
#
# Verify after first run:
#   kubectl -n data create job --from=cronjob/pg-backup pg-backup-manual
#   kubectl -n data logs job/pg-backup-manual -c upload    # expect the dump listed in R2
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: data
spec:
  schedule: "0 17 * * *" # 17:00 UTC = 03:00 AEST — quiet hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # dump (init) → upload (main) via shared emptyDir; pg image matches the live server
          # (pgvector/pgvector:pg16) so pg_dump can never be newer than the daemon it dumps.
          initContainers:
            - name: dump
              image: pgvector/pgvector:pg16
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  pg_dump -Fc -h postgres.data.svc.cluster.local -U gipc -d gipc_ai \
                    -f "/backup/gipc_ai-$(date -u +%Y%m%d-%H%M%S).dump"
                  ls -lh /backup
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres, key: password }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          containers:
            - name: upload
              image: rclone/rclone:1.68
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  rclone copy /backup r2:gipc-backups/pg/ --s3-no-check-bucket
                  # retention: keep 30 days of nightlies
                  rclone delete r2:gipc-backups/pg/ --min-age 30d
                  rclone lsl r2:gipc-backups/pg/ | tail -5
              env:
                - { name: RCLONE_CONFIG_R2_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_R2_PROVIDER, value: Cloudflare }
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: r2-backup, key: AWS_ACCESS_KEY_ID }
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: r2-backup, key: AWS_SECRET_ACCESS_KEY }
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: r2-backup, key: ENDPOINT }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 250m, memory: 128Mi }
          volumes:
            - name: backup
              emptyDir: {}
